<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee;font-family:Arial,sans-serif;text-align:center;padding:20px 10px}
h1{margin:5px 0 20px;font-size:40px}
#colores{display:flex;justify-content:center;gap:10px;margin-bottom:20px}
.color{width:42px;height:42px;border-radius:50%;border:4px solid white;box-shadow:0 2px 5px #777;cursor:pointer}
.color.sel{border-color:#111}
#tablero{width:min(94vw,600px);margin:auto;padding:5px;background:#111;border-radius:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.casilla{position:relative;width:100%;aspect-ratio:1;border:0;border-radius:4px;cursor:pointer;overflow:hidden}
.casilla.tachada:before,.casilla.tachada:after{
content:"";position:absolute;width:110%;height:8px;background:#111;
left:-5%;top:50%;margin-top:-4px;border-radius:5px;z-index:2;pointer-events:none
}
.casilla.tachada:before{transform:rotate(45deg)}
.casilla.tachada:after{transform:rotate(-45deg)}
#nuevo{margin-top:20px;padding:12px 20px;border:0;border-radius:8px;font-size:17px;font-weight:bold}
</style>
</head>
<body>

<h1>🎱 Bingo</h1>

<div id="colores">
<button class="color sel" style="background:#FFD60A" data-c="#FFD60A"></button>
<button class="color" style="background:#34C759" data-c="#34C759"></button>
<button class="color" style="background:#007AFF" data-c="#007AFF"></button>
<button class="color" style="background:#AF52DE" data-c="#AF52DE"></button>
<button class="color" style="background:#FF2D55" data-c="#FF2D55"></button>
</div>

<div id="tablero"></div>

<button id="nuevo">🔀 Nuevo bingo</button>

<script>
const colores=["#FFD60A","#34C759","#007AFF","#AF52DE","#FF2D55"];
let elegido=colores[0];

document.querySelectorAll(".color").forEach(boton=>{
  boton.addEventListener("click",function(){
    elegido=this.dataset.c;
    document.querySelectorAll(".color").forEach(b=>b.classList.remove("sel"));
    this.classList.add("sel");
  });
});

function nuevoBingo(){
  const tablero=document.getElementById("tablero");
  tablero.innerHTML="";

  for(let i=0;i<25;i++){
    const casilla=document.createElement("button");
    casilla.className="casilla";

    const color=colores[Math.floor(Math.random()*colores.length)];
    casilla.style.backgroundColor=color;

    casilla.addEventListener("click",function(){
      this.classList.toggle("tachada");
    });

    tablero.appendChild(casilla);
  }
}

document.getElementById("nuevo").addEventListener("click",nuevoBingo);
nuevoBingo();
</script>

</body>
</html>
