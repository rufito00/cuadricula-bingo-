<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial;text-align:center;padding:20px 10px}h1{margin:5px 0 20px;font-size:40px}#colores{display:flex;justify-content:center;gap:10px;margin-bottom:20px}.color{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 5px #777}.sel{border-color:#111}#tablero{width:min(94vw,600px);margin:auto;padding:5px;background:#111;border-radius:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.casilla{width:100%;aspect-ratio:1;border:0;border-radius:4px}#nuevo{margin-top:20px;padding:12px 20px;border:0;border-radius:8px;font-size:17px}</style></head><body><h1>🎱 Bingo</h1><div id="colores"><button class="color sel" style="background:#ff3b30" data-c="#ff3b30"></button><button class="color" style="background:#ff9500" data-c="#ff9500"></button><button class="color" style="background:#ffd60a" data-c="#ffd60a"></button><button class="color" style="background:#34c759" data-c="#34c759"></button><button class="color" style="background:#007aff" data-c="#007aff"></button><button class="color" style="background:#af52de" data-c="#af52de"></button></div><div id="tablero"></div><button id="nuevo">🔀 Nuevo bingo</button><script>const colores=["#ff3b30","#ff9500","#ffd60a","#34c759","#007aff","#af52de"];let elegido=colores[0],tablero=document.getElementById("tablero");document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{elegido=b.dataset.c;document.querySelectorAll(".color").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});function nuevo(){tablero.innerHTML="";for(let i=0;i<25;i++){let c=document.createElement("button");c.className="casilla";c.style.backgroundColor=colores[Math.floor(Math.random()*colores.length)];c.onclick=()=>c.style.backgroundColor=elegido;tablero.appendChild(c)}}document.getElementById("nuevo").onclick=nuevo;nuevo();</script></body></html>
