<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial;text-align:center;padding:20px 10px}h1{margin:5px 0 20px;font-size:40px}#colores{display:flex;justify-content:center;gap:10px;margin-bottom:20px}.color{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 5px #777}.sel{border-color:#111}#tablero{width:min(94vw,600px);margin:auto;padding:5px;background:#111;border-radius:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.casilla{
width:100%;aspect-ratio:1;border:0;border-radius:4px;
position:relative;overflow:hidden;cursor:pointer
}
.casilla.tachada::after{
content:"";
position:absolute;
left:8%;right:8%;
top:50%;
height:8px;
background:#111;
border-radius:8px;
transform:rotate(-45deg);
box-shadow:0 0 0 2px rgba(255,255,255,.35)
}#nuevo{margin-top:20px;padding:12px 20px;border:0;border-radius:8px;font-size:17px}</style></head><body><h1>🎱 Bingo</h1><div id="colores">
<button class="color sel" style="background:#FFD60A" data-c="#FFD60A"></button>
<button class="color" style="background:#34C759" data-c="#34C759"></button>
<button class="color" style="background:#007AFF" data-c="#007AFF"></button>
<button class="color" style="background:#AF52DE" data-c="#AF52DE"></button>
<button class="color" style="background:#FF2D55" data-c="#FF2D55"></button>
</div><div id="tablero"></div><button id="nuevo">🔀 Nuevo bingo</button><script>const colores=["#FFD60A","#34C759","#007AFF","#AF52DE","#FF2D55"];let elegido=colores[0],tablero=document.getElementById("tablero");document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{elegido=b.dataset.c;document.querySelectorAll(".color").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});function nuevo(){tablero.innerHTML="";for(let i=0;i<25;i++){let c=document.createElement("button");c.className="casilla";c.style.backgroundColor=colores[Math.floor(Math.random()*colores.length)];c.onclick=()=>{c.classList.toggle("tachada");};tablero.appendChild(c)}}document.getElementById("nuevo").onclick=nuevo;nuevo();</script></body></html>
